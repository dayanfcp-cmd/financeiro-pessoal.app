name: Fix Semana occurrences

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-semana-ocorrencias.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Semana
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/app/AtividadesV2Client.tsx')
          s = p.read_text()
          old_call = '<Semana atividades={atividades} membros={membros} adiantamentos={adiantamentos} onEdit={setEditar} onAdvance={adiantarTarefa}/>'
          new_call = '<Semana atividades={atividades} membros={membros} adiantamentos={adiantamentos} householdId={householdId} meuId={meuId} onEdit={setEditar} onAdvance={adiantarTarefa}/>'
          if old_call in s:
              s = s.replace(old_call, new_call, 1)
          start = s.find('function Semana(')
          end = s.find('function dataDia(', start)
          if start < 0 or end < 0:
              raise SystemExit('Componente Semana não encontrado')
          new_week = r'''function Semana({atividades,membros,adiantamentos,householdId,meuId,onEdit,onAdvance}:{atividades:Activity[];membros:Profile[];adiantamentos:ActivityOccurrenceOverride[];householdId:string;meuId:string;onEdit:(a:Activity)=>void;onAdvance:(a:Activity,o:number,t:number)=>void}){
  const supabase=createClient();
  const [dia,setDia]=useState(new Date().getDay());
  const [conclusoes,setConclusoes]=useState<ActivityCompletion[]>([]);
  const [movendo,setMovendo]=useState<string|null>(null);
  const [carregando,setCarregando]=useState(false);
  const inicioSemana=useMemo(()=>{const x=new Date();x.setHours(12,0,0,0);x.setDate(x.getDate()-x.getDay());return x},[]);
  const inicioISO=dataDia(0); const fimISO=dataDia(6);
  useEffect(()=>{let ativo=true;(async()=>{setCarregando(true);const {data}=await supabase.from("activity_completions").select("*").eq("household_id",householdId).gte("data",inicioISO).lte("data",fimISO);if(ativo)setConclusoes((data??[]) as ActivityCompletion[]);setCarregando(false)})();return()=>{ativo=false}},[householdId,inicioISO,fimISO]);
  const dataSelecionada=dataDia(dia);
  const movedIn=adiantamentos.filter(o=>o.target_date===dataSelecionada).map(o=>o.activity_id);
  const movedOut=adiantamentos.filter(o=>o.original_date===dataSelecionada).map(o=>o.activity_id);
  const lista=atividades.filter(a=>a.ativo&&((vence(a,dia)&&!movedOut.includes(a.id))||movedIn.includes(a.id)));
  const conclusaoPorId=new Map(conclusoes.filter(c=>c.data===dataSelecionada).map(c=>[c.activity_id,c]));
  const realizado=(a:Activity)=>{const c=conclusaoPorId.get(a.id);return a.tipo==="flex"?c?.validacao_resultado===true:!!c};
  const quantidadeRealizada=lista.filter(realizado).length;
  return <>
    <div className="grid grid-cols-7 gap-1.5 mb-4">{DIAS.map((d,i)=>{const data=dataDia(i);const total=atividades.filter(a=>a.ativo&&((vence(a,i)&&!adiantamentos.some(o=>o.original_date===data&&o.activity_id===a.id))||adiantamentos.some(o=>o.target_date===data&&o.activity_id===a.id))).length;const concl=conclusoes.filter(c=>c.data===data).filter(c=>{const a=atividades.find(x=>x.id===c.activity_id);return a?.tipo==="flex"?c.validacao_resultado===true:!!a}).length;return <button key={d} onClick={()=>setDia(i)} className="rounded-xl py-2 bg-white shadow-sm active:scale-95 transition" style={{border:dia===i?`2px solid ${ACCENT}`:"2px solid transparent"}}><div className="text-[9.5px] font-bold text-[#6E7091]">{d}</div><div className="text-[9px] font-black text-[#20202D] mt-0.5">{concl}/{total}</div></button>})}</div>
    <div className="flex items-center justify-between mb-2 px-1"><div className="text-[13px] font-bold text-[#6E7091]">{DIAS[dia]} · {dataSelecionada}</div><div className="text-[12px] font-extrabold text-[#12A87A]">{quantidadeRealizada}/{lista.length}</div></div>
    <div className="space-y-3">{membros.map((p,idx)=>{const itens=lista.filter(a=>a.responsavel===p.id);if(!itens.length)return null;return <div key={p.id} className={`rounded-[20px] p-4 shadow-sm ${idx%2===0?"bg-[#EEF8F4] border border-[#CDEDE2]":"bg-[#F2EEFF] border border-[#DDD3FF]"}`}><div className="flex items-center gap-2 mb-2"><div className="w-8 h-8 rounded-full overflow-hidden bg-white grid place-items-center text-[11px] font-black text-[#6C4BF4]">{p.avatar_url?<img src={p.avatar_url} alt={p.nome} className="w-full h-full object-cover"/>:p.nome.charAt(0).toUpperCase()}</div><div className="text-[13px] font-extrabold text-[#20202D]">{p.nome}</div><div className="ml-auto text-[11px] font-black text-[#6E7091]">{itens.filter(realizado).length}/{itens.length}</div></div>{itens.map(a=>{const ok=realizado(a);return <div key={`${a.id}|${dataSelecionada}`} className="py-3 border-t border-black/5 flex items-center gap-3"><div className={`w-7 h-7 rounded-xl border-2 grid place-items-center flex-none ${ok?"bg-[#12A87A] border-[#12A87A]":"bg-white border-[#E2E0EA]"}`}>{ok&&<Icon name="check" className="w-3.5 h-3.5 text-white"/>}</div><div className="flex-1 min-w-0"><div className={`text-[14px] font-semibold ${ok?"line-through text-[#6E7091]":"text-[#20202D]"}`}>{a.nome}</div><div className="text-[10px] text-[#6E7091]">{a.tipo==="flex"?"Flex · validação":"Tarefa"}</div></div><button aria-label={`Editar ${a.nome}`} onClick={()=>onEdit(a)} className="w-9 h-9 rounded-full grid place-items-center text-[#6E7091] hover:bg-white/70 active:scale-90 transition text-[18px]">✎</button>{a.recorrencia!=="diario"&&<button onClick={()=>setMovendo(movendo===a.id?null:a.id)} className="px-2.5 py-2 rounded-xl bg-white/70 text-[10px] font-extrabold text-[#6E7091] active:scale-95">Adiantar</button>}{movendo===a.id&&<select autoFocus defaultValue={dia} onChange={e=>{onAdvance(a,dia,Number(e.target.value));setMovendo(null)}} className="absolute mt-20 right-5 z-20 rounded-xl border border-[#E9E7F5] bg-white px-2 py-2 text-[11px] shadow-lg">{DIAS.map((d,i)=><option key={d} value={i}>{d}</option>)}</select>}</div>})}</div>})}</div>
    {!lista.length&&!carregando&&<Empty text="Nada programado nesse dia"/>}
  </>
}
'''
          s = s[:start] + new_week + s[end:]
          p.write_text(s)
          PY
      - name: Commit patched file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/app/AtividadesV2Client.tsx
          git diff --cached --quiet || git commit -m 'fix: criar ocorrencias independentes por dia na semana'
          git push
