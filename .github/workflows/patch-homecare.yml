name: Patch Home Care
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[homecare-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate activity state declaration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/app/AtividadesV2Client.tsx')
          s = p.read_text()
          duplicate = '  const [adiantamentos,setAdiantamentos] = useState<ActivityOccurrenceOverride[]>([]);\n  const [adiantamentos,setAdiantamentos] = useState<ActivityOccurrenceOverride[]>([]);'
          s = s.replace(duplicate, '  const [adiantamentos,setAdiantamentos] = useState<ActivityOccurrenceOverride[]>([]);')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/app/AtividadesV2Client.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove duplicate advancement state [homecare-patch]"
          git push
