name: Maintain activity date logic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  maintain:
    if: ${{ !contains(github.event.head_commit.message, '[date-maintained]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix activity calendar dates
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/app/AtividadesV2Client.tsx')
          s=p.read_text()
          old='const hojeISO = () => new Date().toISOString().slice(0, 10);'
          new='''const dataLocalISO = (d = new Date()) => {\n  const partes = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(d);\n  const get = (tipo: string) => partes.find((p) => p.type === tipo)?.value ?? "";\n  return `${get("year")}-${get("month")}-${get("day")}`;\n};\nconst hojeISO = () => dataLocalISO();'''
          if old in s:
              s=s.replace(old,new,1)
          old2='return x.toISOString().slice(0,10);'
          if old2 in s:
              s=s.replace(old2,'return dataLocalISO(x);',1)
          p.write_text(s)
          PY
      - name: Commit date fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/app/AtividadesV2Client.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: use Sao Paulo calendar day for activities [date-maintained]"
          git push
