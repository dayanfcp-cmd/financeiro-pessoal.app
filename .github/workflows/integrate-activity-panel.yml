name: Integrate activity panel
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[panel-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate panel
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/app/AtividadesV2Client.tsx')
          s=p.read_text()
          imp='import { PainelAtividades } from "@/components/app/PainelAtividades";\n'
          if imp not in s:
              marker='import type { Activity, ActivityCompletion, ActivityOccurrenceOverride, Profile, ShoppingItem, Recorrencia, ActivityType } from "@/lib/types/database";\n'
              if marker not in s: raise SystemExit('import marker not found')
              s=s.replace(marker, marker+imp, 1)
          old='{aba==="painel"&&<><SectionTitle text="Painel" meta="histórico"/><div className="grid grid-cols-2 gap-3 mb-6"><Metric label="Verificações" value={String(conclusoes.filter(c=>c.verificado_em).length)}/><Metric label="Contabilizadas" value={String(conclusoes.filter(c=>c.validacao_resultado===true).length)}/></div><div className="text-[13px] font-bold text-[#6E7091] mb-2">Compras arquivadas</div><div className="bg-white rounded-[20px] px-4 shadow-sm">{arquivadasCompra.length?arquivadasCompra.map(i=><div key={i.id} className="py-3 border-b border-[#E9E7F5] last:border-0 text-[14px] font-semibold text-[#6E7091]">{i.nome}</div>):<Empty text="Nenhuma compra arquivada"/>}</div></>}'
          new='{aba==="painel"&&<PainelAtividades meuId={meuId} membros={membros}/>}'
          if old not in s: raise SystemExit('panel marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/app/AtividadesV2Client.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate user activity dashboard [panel-integrated]"
          git push
