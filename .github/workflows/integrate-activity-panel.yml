name: Maintain activity date and period logic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  maintain:
    if: ${{ !contains(github.event.head_commit.message, '[date-maintained]') && !contains(github.event.head_commit.message, '[period-maintained]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix activity calendar, weekly occurrences and periods
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/app/AtividadesV2Client.tsx')
          s=p.read_text()
          old='const hojeISO = () => new Date().toISOString().slice(0, 10);'
          new='''const dataLocalISO = (d = new Date()) => {\n  const partes = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(d);\n  const get = (tipo: string) => partes.find((p) => p.type === tipo)?.value ?? "";\n  return `${get("year")}-${get("month")}-${get("day")}`;\n};\nconst hojeISO = () => dataLocalISO();'''
          if old in s: s=s.replace(old,new,1)
          old2='return x.toISOString().slice(0,10);'
          if old2 in s: s=s.replace(old2,'return dataLocalISO(x);',1)
          old_call='<Semana atividades={atividades} membros={membros} adiantamentos={adiantamentos} onEdit={setEditar} onAdvance={adiantarTarefa}/>'
          new_call='<Semana atividades={atividades} membros={membros} adiantamentos={adiantamentos} householdId={householdId} onEdit={setEditar} onAdvance={adiantarTarefa}/>'
          if old_call in s: s=s.replace(old_call,new_call,1)

          # Add period model/constants.
          marker='const ACCENT = "#12A87A";'
          period='''const PERIODOS = [\n  { id: "matutino", label: "MATUTINO", color: "#F4B400", bg: "#FFF8E8", border: "#F6D98B" },\n  { id: "vespertino", label: "VESPERTINO", color: "#2878D8", bg: "#EEF5FF", border: "#C9DDF8" },\n  { id: "noturno", label: "NOTURNO", color: "#7447D9", bg: "#F3EEFF", border: "#DCCEFF" },\n] as const;\nconst periodoOrDefault = (a: Activity) => (a.periodo === "vespertino" || a.periodo === "noturno") ? a.periodo : "matutino";\nconst periodoInfo = (a: Activity) => PERIODOS.find(p => p.id === periodoOrDefault(a)) ?? PERIODOS[0];'''
          if marker in s and 'const PERIODOS = [' not in s: s=s.replace(marker, marker+'\n'+period,1)

          # Sort today's tasks by period, then name.
          marker2='const feitas=useMemo(()=>new Map(conclusoes.map(c=>[c.activity_id,c])),[conclusoes]);'
          insert='''const minhasOrdenadas=[...minhas].sort((a,b)=>{const oa=PERIODOS.findIndex(p=>p.id===periodoOrDefault(a));const ob=PERIODOS.findIndex(p=>p.id===periodoOrDefault(b));return oa-ob||a.nome.localeCompare(b.nome,"pt-BR")});'''
          if marker2 in s and 'const minhasOrdenadas=' not in s: s=s.replace(marker2, marker2+'\n  '+insert,1)
          # Add period badge to today's task rows while preserving existing layout.
          oldrow='<div className={`text-[14.5px] font-semibold ${realizado?"line-through text-[#6E7091]":""}`}>{a.nome}</div>'
          newrow='<div className="flex items-center gap-2"><div className={`text-[14.5px] font-semibold ${realizado?"line-through text-[#6E7091]":""}`}>{a.nome}</div><span style={{color:periodoInfo(a).color,background:periodoInfo(a).bg,borderColor:periodoInfo(a).border}} className="px-1.5 py-0.5 rounded-md border text-[8px] font-black tracking-wide">{periodoInfo(a).label.slice(0,3)}</span></div>'
          if oldrow in s: s=s.replace(oldrow,newrow,1)
          s=s.replace('minhas.map(a=>{const c=feitas.get(a.id);', 'minhasOrdenadas.map(a=>{const c=feitas.get(a.id);',1)

          # Persist period when editing.
          old_edit='recorrencia:rec,dias_semana:rec==="diario"?null:dias'
          new_edit='recorrencia:rec,dias_semana:rec==="diario"?null:dias,periodo'
          if old_edit in s: s=s.replace(old_edit,new_edit,1)
          # Add period state to EditarAtividade.
          old_state='const [dias,setDias]=useState<number[]>(atividade.dias_semana||[]);'
          new_state=old_state+'const [periodo,setPeriodo]=useState<ActivityPeriod>(atividade.periodo||"matutino");'
          if old_state in s and 'useState<ActivityPeriod>(atividade.periodo' not in s: s=s.replace(old_state,new_state,1)
          # Add period selector to EditarAtividade before scheduling.
          marker_edit='<label className="block text-[12px] font-bold text-[#6E7091] mt-4">Quando acontece</label>'
          selector='''<label className="block text-[12px] font-bold text-[#6E7091] mt-4">Período</label><div className="grid grid-cols-3 gap-2 mt-2">{PERIODOS.map(p=><button type="button" key={p.id} onClick={()=>setPeriodo(p.id as ActivityPeriod)} style={{borderColor:periodo===p.id?p.color:"#E9E7F5",background:periodo===p.id?p.bg:"white",color:periodo===p.id?p.color:"#6E7091"}} className="rounded-2xl py-3 text-[10px] font-black">{p.label}</button>)}</div>'''
          if marker_edit in s and 'Período</label><div className="grid grid-cols-3' not in s: s=s.replace(marker_edit,selector+marker_edit,1)

          # New activity: period state, required insert and selector.
          old_new_state='const [dias,setDias]=useState<number[]>([]);'
          new_new_state=old_new_state+'const [periodo,setPeriodo]=useState<ActivityPeriod>("matutino");'
          if old_new_state in s and 'useState<ActivityPeriod>("matutino")' not in s: s=s.replace(old_new_state,new_new_state,1)
          old_insert='recorrencia:rec,dias_semana:rec==="diario"?null:dias,ativo:true'
          new_insert='recorrencia:rec,dias_semana:rec==="diario"?null:dias,periodo,ativo:true'
          if old_insert in s: s=s.replace(old_insert,new_insert,1)
          marker_new='<div className="mt-4"><div className="text-[12px] font-bold text-[#6E7091] mb-2">Programação</div>'
          selector_new='''<div className="mt-4"><div className="text-[12px] font-bold text-[#6E7091] mb-2">Período</div><div className="grid grid-cols-3 gap-2">{PERIODOS.map(p=><button type="button" key={p.id} onClick={()=>setPeriodo(p.id as ActivityPeriod)} style={{borderColor:periodo===p.id?p.color:"#E9E7F5",background:periodo===p.id?p.bg:"white",color:periodo===p.id?p.color:"#6E7091"}} className="rounded-2xl py-3 text-[10px] font-black border">{p.label}</button>)}</div></div>'''
          if marker_new in s and 'className="rounded-2xl py-3 text-[10px] font-black border">{p.label}</button>)}</div></div><div className="mt-4"><div className="text-[12px] font-bold text-[#6E7091] mb-2">Programação' not in s:
              s=s.replace(marker_new,selector_new+marker_new,1)

          # Replace the Week component with a period-grouped version.
          start=s.find('function Semana(')
          end=s.find('function dataDia(',start)
          if start<0 or end<0: raise SystemExit('Semana não encontrada')
          week='''function Semana({atividades,membros,adiantamentos,householdId,onEdit,onAdvance}:{atividades:Activity[];membros:Profile[];adiantamentos:ActivityOccurrenceOverride[];householdId:string;onEdit:(a:Activity)=>void;onAdvance:(a:Activity,o:number,t:number)=>void}){\n  const supabase=createClient();\n  const [dia,setDia]=useState(new Date().getDay());\n  const [conclusoes,setConclusoes]=useState<ActivityCompletion[]>([]);\n  const [movendo,setMovendo]=useState<string|null>(null);\n  const inicioISO=useMemo(()=>dataDia(0),[]);\n  const fimISO=useMemo(()=>dataDia(6),[]);\n  useEffect(()=>{let ativo=true;(async()=>{const {data}=await supabase.from("activity_completions").select("*").eq("household_id",householdId).gte("data",inicioISO).lte("data",fimISO);if(ativo)setConclusoes((data??[]) as ActivityCompletion[])})();return()=>{ativo=false}},[householdId,inicioISO,fimISO]);\n  const dataSelecionada=dataDia(dia);\n  const movedIn=adiantamentos.filter(o=>o.target_date===dataSelecionada).map(o=>o.activity_id);\n  const movedOut=adiantamentos.filter(o=>o.original_date===dataSelecionada).map(o=>o.activity_id);\n  const lista=atividades.filter(a=>a.ativo&&((vence(a,dia)&&!movedOut.includes(a.id))||movedIn.includes(a.id)));\n  const realizado=(a:Activity)=>{const c=conclusoes.find(x=>x.activity_id===a.id&&x.data===dataSelecionada);return a.tipo==="flex"?c?.validacao_resultado===true:!!c};\n  const totalRealizadas=lista.filter(realizado).length;\n  return <><div className="grid grid-cols-7 gap-1.5 mb-4">{DIAS.map((d,i)=>{const data=dataDia(i);const total=atividades.filter(a=>a.ativo&&((vence(a,i)&&!adiantamentos.some(o=>o.original_date===data&&o.activity_id===a.id))||adiantamentos.some(o=>o.target_date===data&&o.activity_id===a.id))).length;const concl=conclusoes.filter(c=>c.data===data).filter(c=>{const a=atividades.find(x=>x.id===c.activity_id);return a?.tipo==="flex"?c.validacao_resultado===true:!!a}).length;return <button key={d} onClick={()=>setDia(i)} className="rounded-xl py-2 bg-white shadow-sm active:scale-95 transition" style={{border:dia===i?`2px solid ${ACCENT}`:"2px solid transparent"}}><div className="text-[9.5px] font-bold text-[#6E7091]">{d}</div><div className="text-[9px] font-black text-[#20202D] mt-0.5">{concl}/{total}</div></button>})}</div><div className="flex items-center justify-between mb-2 px-1"><div className="text-[13px] font-bold text-[#6E7091]">{DIAS[dia]} · {dataSelecionada}</div><div className="text-[12px] font-extrabold text-[#12A87A]">{totalRealizadas}/{lista.length}</div></div><div className="space-y-3">{membros.map((p,idx)=>{const itens=lista.filter(a=>a.responsavel===p.id);if(!itens.length)return null;const cor=idx%2===0?"bg-[#EEF8F4] border-[#CDEDE2]":"bg-[#F2EEFF] border-[#DDD3FF]";return <div key={p.id} className={`rounded-[20px] p-4 shadow-sm border ${cor}`}><div className="flex items-center gap-2 mb-2"><div className="w-8 h-8 rounded-full overflow-hidden bg-white grid place-items-center text-[11px] font-black text-[#6C4BF4]">{p.avatar_url?<img src={p.avatar_url} alt={p.nome} className="w-full h-full object-cover"/>:p.nome.charAt(0).toUpperCase()}</div><div className="text-[13px] font-extrabold text-[#20202D]">{p.nome}</div><div className="ml-auto text-[11px] font-black text-[#6E7091]">{itens.filter(realizado).length}/{itens.length}</div></div>{PERIODOS.map(periodo=>{const grupo=itens.filter(a=>periodoOrDefault(a)===periodo.id);if(!grupo.length)return null;return <div key={periodo.id} className="mt-3"><div style={{color:periodo.color,background:periodo.bg,borderColor:periodo.border}} className="flex items-center gap-2 px-3 py-2 rounded-xl border text-[10px] font-black tracking-wide"><span className="w-2 h-2 rounded-full" style={{background:periodo.color}}/>{periodo.label}</div>{grupo.map(a=>{const ok=realizado(a);return <div key={`${a.id}|${dataSelecionada}`} className="py-3 border-t border-black/5 flex items-center gap-3"><div className={`w-7 h-7 rounded-xl border-2 grid place-items-center flex-none ${ok?"bg-[#12A87A] border-[#12A87A]":"bg-white border-[#E2E0EA]"}`}>{ok&&<Icon name="check" className="w-3.5 h-3.5 text-white"/>}</div><div className="flex-1 min-w-0"><div className={`flex items-center gap-2 text-[14px] font-semibold ${ok?"line-through text-[#6E7091]":"text-[#20202D]"}`}>{a.nome}<span style={{color:periodo.color,background:periodo.bg,borderColor:periodo.border}} className="px-1.5 py-0.5 rounded-md border text-[8px] font-black">{periodo.label.slice(0,3)}</span></div><div className="text-[10px] text-[#6E7091]">{a.tipo==="flex"?"Flex · validação":"Tarefa"}{movedIn.includes(a.id)?" · adiantada para hoje":""}</div></div><button aria-label={`Editar ${a.nome}`} onClick={()=>onEdit(a)} className="w-9 h-9 rounded-full grid place-items-center text-[#6E7091] hover:bg-white/70 active:scale-90 transition text-[18px]">✎</button>{a.recorrencia!=="diario"&&<button onClick={()=>setMovendo(movendo===a.id?null:a.id)} className="px-2.5 py-2 rounded-xl bg-white/70 text-[10px] font-extrabold text-[#6E7091] active:scale-95">Adiantar</button>}{movendo===a.id&&<select autoFocus defaultValue={dia} onChange={e=>{onAdvance(a,dia,Number(e.target.value));setMovendo(null)}} className="absolute mt-20 right-5 z-20 rounded-xl border border-[#E9E7F5] bg-white px-2 py-2 text-[11px] shadow-lg">{DIAS.map((d,i)=><option key={d} value={i}>{d}</option>)}</select>}</div>})}</div>})}</div>})}</div>{!lista.length&&<Empty text="Nada programado nesse dia"/>}</>\n}\n'''
          s=s[:start]+week+s[end:]
          p.write_text(s)

          # Add the new type to the shared model.
          t=Path('lib/types/database.ts')
          ts=t.read_text()
          if 'export type ActivityPeriod' not in ts:
              ts=ts.replace('export type ActivityType = "normal" | "flex";','export type ActivityType = "normal" | "flex";\nexport type ActivityPeriod = "matutino" | "vespertino" | "noturno";')
          ts=ts.replace('responsavel:string|null; criado_por:string|null; ativo:boolean; }','responsavel:string|null; criado_por:string|null; periodo:ActivityPeriod; ativo:boolean; }')
          t.write_text(ts)
          PY
      - name: Commit period changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/app/AtividadesV2Client.tsx lib/types/database.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: periodos matutino vespertino noturno [period-maintained]"
          git push
